[project]
name = "ffxivscraper"
version = "0.2.0"
description = "FFXIV Lodestone scraper."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Stanislav Vishnevskiy", email = "vishnevskiy@gmail.com" },
]
maintainers = [{ name = "Matthew Scragg", email = "scragg@gmail.com" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "beautifulsoup4>=4.12",
    "gevent>=24.0",
    "requests>=2.32",
    "docopt>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
lodestoner = "ffxivscraper.cli:main"

[project.urls]
Homepage = "https://github.com/scragg0x/FFXIV-Scraper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffxivscraper"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

# bs4's inline types (4.13+) are too strict for the unguarded
# select(...)[0] / .parent.parent idiom that the Lodestone scraper
# depends on. The selectors are validated against real HTML in tests.
[[tool.mypy.overrides]]
module = "bs4"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
